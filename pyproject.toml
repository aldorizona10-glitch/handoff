[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-browser"
version = "0.1.0"
description = "Log in yourself. Hand the browser to an AI. Approve before it acts. A local-first, human-in-the-loop browser-automation framework."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aldo Rizona" }]
keywords = ["ai", "agent", "browser-automation", "playwright", "anthropic", "claude", "human-in-the-loop"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "anthropic>=0.40",
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
handoff = "handoff.cli:main"

[project.urls]
Homepage = "https://github.com/aldorizona10-glitch/handoff"
Source = "https://github.com/aldorizona10-glitch/handoff"

[tool.setuptools]
packages = ["handoff"]
